# Phase 5 Master Evaluation Configuration
evaluation:
  random_seed: 42
  bootstrap_iterations: 1000
  confidence_level: 0.95
  
datasets:
  interactions_path: "data/processed/interactions.jsonl"
  splits_path: "data/processed/splits.json"
  golden_set_path: "evaluations/golden_set/golden_set.jsonl"
  judge_dev_path: "data/evaluation/judge_dev.jsonl"
  
model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  fallback_runtime: "deterministic_evidence_synthesizer"
  max_new_tokens: 150
  temperature: 0.1
  top_p: 0.9
  repetition_penalty: 1.1

retrieval:
  corpus_unit: "unit_b"
  candidate_pool_size: 10000
  rrf_k: 60
  diversity_threshold: 0.75
  max_template_quota: 2

judge:
  evaluator_name: "Phase5MultiDimensionalJudge"
  rubric_scale: "0_to_3"
  dimensions:
    - "helpfulness"
    - "relevance"
    - "groundedness"
    - "safety"
    - "actionability"
    - "escalation_appropriateness"

human_eval:
  sample_size: 50
  dual_annotated_size: 30
  target_kappa_min: 0.70
